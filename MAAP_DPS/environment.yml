name: viirs_cubed
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13.13

  # --- Core data ---
  - numpy=2.4.6
  - pandas=2.3.3
  - geopandas=1.1.3
  - pyarrow=23.0.1
  - xarray=2026.4.0
  - zarr=3.2.1
  - netcdf4=1.7.4
  - h5netcdf=1.8.1

  # --- Geospatial ---
  - rasterio=1.5.0
  - rioxarray=0.22.0
  - pyproj=3.7.2
  - shapely=2.1.2
  - pyogrio=0.12.1
  - cartopy=0.25.0

  # --- S3 / cloud I/O ---
  - s3fs=2026.4.0
  - fsspec=2026.4.0
  - boto3=1.43.0
  - botocore=1.43.0
  - s3transfer=0.17.1
  - aiobotocore=3.7.0

  # --- Earth data access ---
  - earthaccess=0.18.0

  # --- Visualization (optional but imported) ---
  - matplotlib-base=3.10.9

  # --- Utilities ---
  - tqdm=4.67.3
  - pyyaml=6.0.3
  - requests=2.32.5
  - blosc=1.21.6